services:
  - type: web
    name: intraday-momentum-scanner
    env: python
    plan: starter
    rootDir: outputs
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 -m uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: KITE_API_KEY
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false
      - key: FAST_MODE
        value: "false"
      - key: SCAN_COMPUTE_EVERY_SEC
        value: "8"
      - key: SEED_DAYS_5M
        value: "7"
      - key: SEED_DAYS_DAILY
        value: "120"
