services:
  - type: web
    name: intraday-momentum-scanner
    env: python
    plan: starter
    rootDir: outputs
    buildCommand: rm -rf .deps && /usr/bin/python3 -m pip install --no-cache-dir --target .deps -r requirements.txt
    startCommand: PYTHONPATH=.deps /usr/bin/python3 -m uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: KITE_API_KEY
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false