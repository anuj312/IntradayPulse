services:
  - type: web
    name: intraday-momentum-scanner
    env: python
    plan: starter
    rootDir: outputs
    buildCommand: /usr/bin/python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
    startCommand: .venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: KITE_API_KEY
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false