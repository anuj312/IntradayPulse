services:
  - type: web
    name: intraday-momentum-scanner
    env: python
    plan: starter
    rootDir: outputs
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m gunicorn --workers 1 --bind 0.0.0.0:$PORT live_scanner_server:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: KITE_API_KEY
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false
